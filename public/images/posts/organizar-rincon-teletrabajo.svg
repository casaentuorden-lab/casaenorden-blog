<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#F1E9D8"/>

  <!-- pared -->
  <rect x="0" y="0" width="1200" height="500" fill="#F8F3E9"/>
  <!-- mesa -->
  <rect x="0" y="500" width="1200" height="400" fill="#2F4A3C"/>
  <rect x="0" y="500" width="1200" height="14" fill="#243A2F"/>

  <!-- panel perforado con ganchos -->
  <rect x="820" y="80" width="280" height="380" rx="14" fill="none" stroke="#2F4A3C" stroke-width="6"/>
  <g fill="#2F4A3C">
    <circle cx="870" cy="130" r="6"/><circle cx="930" cy="130" r="6"/><circle cx="990" cy="130" r="6"/><circle cx="1050" cy="130" r="6"/>
    <circle cx="870" cy="190" r="6"/><circle cx="930" cy="190" r="6"/><circle cx="990" cy="190" r="6"/><circle cx="1050" cy="190" r="6"/>
    <circle cx="870" cy="250" r="6"/><circle cx="930" cy="250" r="6"/><circle cx="990" cy="250" r="6"/><circle cx="1050" cy="250" r="6"/>
  </g>
  <path d="M930 190 v30 q0 12 -20 12 h-10" stroke="#C4923D" stroke-width="5" fill="none"/>
  <circle cx="890" cy="234" r="16" fill="#F1E9D8" stroke="#C4923D" stroke-width="4"/>

  <!-- monitor sobre soporte elevador -->
  <rect x="120" y="200" width="360" height="220" rx="10" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="6"/>
  <rect x="150" y="230" width="300" height="160" rx="4" fill="#F8F3E9"/>
  <rect x="270" y="420" width="60" height="30" fill="#2F4A3C"/>
  <rect x="220" y="450" width="160" height="16" rx="6" fill="#2F4A3C"/>

  <!-- soporte elevador (base) -->
  <rect x="150" y="466" width="300" height="34" rx="10" fill="#C4923D" opacity="0.85"/>

  <!-- bandejas apilables de documentos -->
  <g>
    <rect x="540" y="380" width="220" height="40" rx="8" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="5"/>
    <rect x="540" y="430" width="220" height="40" rx="8" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="5"/>
    <rect x="540" y="480" width="220" height="40" rx="8" fill="#F1E9D8" stroke="#C4923D" stroke-width="5"/>
  </g>

  <!-- caja de cables -->
  <rect x="560" y="620" width="200" height="90" rx="14" fill="#F1E9D8" stroke="#C4923D" stroke-width="6"/>
  <path d="M580 660 q40 30 80 0 q40 -30 80 0" stroke="#2F4A3C" stroke-width="4" fill="none"/>

  <!-- taza / accesorio vertical -->
  <rect x="900" y="600" width="60" height="90" rx="10" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="5"/>
  <line x1="915" y1="620" x2="915" y2="670" stroke="#C4923D" stroke-width="5"/>
  <line x1="930" y1="620" x2="930" y2="670" stroke="#C4923D" stroke-width="5"/>
  <line x1="945" y1="620" x2="945" y2="670" stroke="#C4923D" stroke-width="5"/>

  <text x="600" y="860" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#F1E9D8" opacity="0.55">
    Casa en Orden — sustituye por tu fotografía real
  </text>
</svg>
