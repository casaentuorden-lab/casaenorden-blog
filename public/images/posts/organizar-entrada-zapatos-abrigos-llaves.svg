<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#F1E9D8"/>

  <!-- pared -->
  <rect x="0" y="0" width="1200" height="620" fill="#F8F3E9"/>
  <!-- suelo -->
  <rect x="0" y="620" width="1200" height="280" fill="#2F4A3C"/>
  <rect x="0" y="620" width="1200" height="14" fill="#243A2F"/>

  <!-- perchero de pared con ganchos -->
  <rect x="100" y="140" width="500" height="16" rx="8" fill="#2F4A3C"/>
  <g fill="#C4923D">
    <circle cx="150" cy="176" r="10"/>
    <circle cx="290" cy="176" r="10"/>
    <circle cx="430" cy="176" r="10"/>
    <circle cx="560" cy="176" r="10"/>
  </g>
  <!-- abrigos colgados -->
  <g fill="#F1E9D8" stroke="#2F4A3C" stroke-width="4">
    <path d="M120 190 h60 l20 140 h-100 z"/>
    <path d="M260 190 h60 l20 140 h-100 z" fill="#F8F3E9"/>
    <path d="M400 190 h60 l20 140 h-100 z"/>
  </g>
  <!-- bufanda en un gancho -->
  <path d="M560 176 q30 40 0 80 q-30 40 0 80" stroke="#C4923D" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- organizador de llaves y correo -->
  <g>
    <rect x="700" y="160" width="200" height="140" rx="12" fill="#F1E9D8" stroke="#C4923D" stroke-width="6"/>
    <circle cx="740" cy="200" r="10" fill="#2F4A3C"/>
    <circle cx="780" cy="200" r="10" fill="#2F4A3C"/>
    <circle cx="820" cy="200" r="10" fill="#2F4A3C"/>
    <rect x="720" y="240" width="150" height="40" rx="6" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
  </g>

  <!-- banco con almacenaje -->
  <g>
    <rect x="950" y="220" width="200" height="70" rx="14" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="6"/>
    <line x1="970" y1="290" x2="970" y2="340" stroke="#2F4A3C" stroke-width="8"/>
    <line x1="1130" y1="290" x2="1130" y2="340" stroke="#2F4A3C" stroke-width="8"/>
  </g>

  <!-- zapatero estrecho de perfil bajo -->
  <g>
    <rect x="120" y="700" width="440" height="90" rx="10" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="6"/>
    <line x1="120" y1="745" x2="560" y2="745" stroke="#2F4A3C" stroke-width="3"/>
    <ellipse cx="170" cy="725" rx="24" ry="11" fill="#2F4A3C"/>
    <ellipse cx="230" cy="725" rx="24" ry="11" fill="#2F4A3C"/>
    <ellipse cx="290" cy="725" rx="24" ry="11" fill="#2F4A3C"/>
    <ellipse cx="170" cy="770" rx="24" ry="11" fill="#C4923D"/>
    <ellipse cx="230" cy="770" rx="24" ry="11" fill="#C4923D"/>
    <ellipse cx="290" cy="770" rx="24" ry="11" fill="#C4923D"/>
  </g>

  <!-- alfombra -->
  <rect x="640" y="740" width="420" height="90" rx="16" fill="#F1E9D8" opacity="0.9"/>
  <rect x="670" y="765" width="360" height="10" fill="#C4923D" opacity="0.7"/>
  <rect x="670" y="795" width="360" height="10" fill="#C4923D" opacity="0.7"/>

  <text x="600" y="875" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#F1E9D8" opacity="0.55">
    Casa en Orden — sustituye por tu fotografía real
  </text>
</svg>
