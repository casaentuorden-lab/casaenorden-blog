<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#F1E9D8"/>

  <!-- fondo tipo mesa vista desde arriba -->
  <rect x="0" y="0" width="1200" height="900" fill="#F8F3E9"/>

  <!-- cajon abierto -->
  <rect x="100" y="120" width="1000" height="560" rx="20" fill="#2F4A3C"/>
  <rect x="140" y="160" width="920" height="480" rx="14" fill="#F1E9D8"/>

  <!-- organizador de cubiertos -->
  <g>
    <rect x="170" y="190" width="260" height="420" rx="10" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="5"/>
    <line x1="170" y1="330" x2="430" y2="330" stroke="#2F4A3C" stroke-width="4"/>
    <line x1="300" y1="190" x2="300" y2="330" stroke="#2F4A3C" stroke-width="4"/>
    <line x1="170" y1="470" x2="430" y2="470" stroke="#2F4A3C" stroke-width="4"/>

    <!-- cubiertos -->
    <g stroke="#C4923D" stroke-width="6" stroke-linecap="round">
      <line x1="215" y1="215" x2="215" y2="305"/>
      <line x1="255" y1="215" x2="255" y2="305"/>
      <line x1="355" y1="215" x2="355" y2="305"/>
      <line x1="235" y1="360" x2="235" y2="450"/>
      <line x1="365" y1="360" x2="365" y2="450"/>
      <line x1="235" y1="500" x2="235" y2="590"/>
      <line x1="365" y1="500" x2="365" y2="590"/>
    </g>
  </g>

  <!-- separadores expandibles -->
  <g>
    <rect x="470" y="190" width="220" height="420" rx="10" fill="#F8F3E9" stroke="#C4923D" stroke-width="5"/>
    <line x1="530" y1="190" x2="530" y2="610" stroke="#C4923D" stroke-width="4"/>
    <line x1="590" y1="190" x2="590" y2="610" stroke="#C4923D" stroke-width="4"/>
    <line x1="650" y1="190" x2="650" y2="610" stroke="#C4923D" stroke-width="4"/>
    <!-- utensilios de pie -->
    <ellipse cx="500" cy="230" rx="16" ry="26" fill="#2F4A3C"/>
    <ellipse cx="560" cy="230" rx="16" ry="26" fill="#2F4A3C"/>
    <ellipse cx="620" cy="230" rx="16" ry="26" fill="#2F4A3C"/>
    <ellipse cx="670" cy="230" rx="16" ry="26" fill="#2F4A3C"/>
  </g>

  <!-- organizador vertical de tapas -->
  <g>
    <rect x="730" y="190" width="330" height="420" rx="10" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="5"/>
    <rect x="750" y="210" width="30" height="380" rx="6" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="3"/>
    <rect x="795" y="210" width="30" height="380" rx="6" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="3"/>
    <rect x="840" y="210" width="30" height="380" rx="6" fill="#F1E9D8" stroke="#C4923D" stroke-width="3"/>
    <rect x="885" y="210" width="30" height="380" rx="6" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="3"/>
    <rect x="930" y="210" width="30" height="380" rx="6" fill="#F1E9D8" stroke="#C4923D" stroke-width="3"/>
    <rect x="975" y="210" width="30" height="380" rx="6" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="3"/>
    <rect x="1020" y="210" width="30" height="380" rx="6" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="3"/>
  </g>

  <rect x="0" y="800" width="1200" height="100" fill="#2F4A3C"/>
  <text x="600" y="862" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#F1E9D8" opacity="0.55">
    Casa en Orden — sustituye por tu fotografía real
  </text>
</svg>
