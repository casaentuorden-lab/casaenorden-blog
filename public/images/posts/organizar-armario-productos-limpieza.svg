<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#F1E9D8"/>

  <!-- pared -->
  <rect x="0" y="0" width="1200" height="620" fill="#F8F3E9"/>
  <!-- suelo -->
  <rect x="0" y="620" width="1200" height="280" fill="#2F4A3C"/>
  <rect x="0" y="620" width="1200" height="14" fill="#243A2F"/>

  <!-- puerta de armario abierta con organizador de sprays -->
  <rect x="90" y="90" width="360" height="530" rx="14" fill="none" stroke="#2F4A3C" stroke-width="8"/>
  <g>
    <rect x="130" y="130" width="280" height="14" fill="#C4923D"/>
    <rect x="130" y="220" width="280" height="14" fill="#C4923D"/>
    <rect x="130" y="310" width="280" height="14" fill="#C4923D"/>
  </g>
  <!-- sprays colgados -->
  <g fill="#F1E9D8" stroke="#2F4A3C" stroke-width="4">
    <rect x="150" y="150" width="46" height="66" rx="8"/>
    <rect x="163" y="134" width="20" height="20" rx="4" fill="#C4923D" stroke="none"/>
    <rect x="230" y="150" width="46" height="66" rx="8"/>
    <rect x="243" y="134" width="20" height="20" rx="4" fill="#C4923D" stroke="none"/>
    <rect x="310" y="150" width="46" height="66" rx="8"/>
    <rect x="323" y="134" width="20" height="20" rx="4" fill="#C4923D" stroke="none"/>

    <rect x="150" y="240" width="46" height="66" rx="8"/>
    <rect x="163" y="224" width="20" height="20" rx="4" fill="#C4923D" stroke="none"/>
    <rect x="230" y="240" width="46" height="66" rx="8"/>
    <rect x="243" y="224" width="20" height="20" rx="4" fill="#C4923D" stroke="none"/>
    <rect x="310" y="240" width="46" height="66" rx="8"/>
    <rect x="323" y="224" width="20" height="20" rx="4" fill="#C4923D" stroke="none"/>
  </g>

  <!-- balda alta con cierre de seguridad -->
  <rect x="130" y="400" width="280" height="16" fill="#2F4A3C"/>
  <rect x="160" y="360" width="80" height="40" rx="6" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="4"/>
  <rect x="260" y="360" width="80" height="40" rx="6" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="4"/>

  <!-- caddy portatil -->
  <g>
    <rect x="560" y="420" width="220" height="130" rx="12" fill="#F1E9D8" stroke="#C4923D" stroke-width="6"/>
    <path d="M600 420 v-40 q0 -20 70 -20 q70 0 70 20 v40" fill="none" stroke="#2F4A3C" stroke-width="6"/>
    <line x1="670" y1="420" x2="670" y2="550" stroke="#C4923D" stroke-width="4"/>
    <rect x="580" y="450" width="60" height="80" rx="8" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
    <rect x="700" y="450" width="60" height="80" rx="8" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
  </g>

  <!-- organizador colgante de bayetas y guantes -->
  <g>
    <rect x="880" y="360" width="160" height="220" rx="10" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="6"/>
    <line x1="880" y1="415" x2="1040" y2="415" stroke="#2F4A3C" stroke-width="3"/>
    <line x1="880" y1="470" x2="1040" y2="470" stroke="#2F4A3C" stroke-width="3"/>
    <line x1="880" y1="525" x2="1040" y2="525" stroke="#2F4A3C" stroke-width="3"/>
    <line x1="960" y1="360" x2="960" y2="580" stroke="#2F4A3C" stroke-width="3"/>
    <circle cx="920" cy="388" r="10" fill="#C4923D"/>
    <circle cx="1000" cy="388" r="10" fill="#C4923D"/>
    <circle cx="920" cy="443" r="10" fill="#C4923D"/>
    <circle cx="1000" cy="443" r="10" fill="#C4923D"/>
  </g>

  <!-- bandeja antigoteo -->
  <rect x="130" y="560" width="290" height="20" rx="6" fill="#C4923D" opacity="0.7"/>

  <text x="600" y="875" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#F1E9D8" opacity="0.55">
    Casa en Orden — sustituye por tu fotografía real
  </text>
</svg>
