<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#F1E9D8"/>

  <!-- pared -->
  <rect x="0" y="0" width="1200" height="620" fill="#F8F3E9"/>
  <!-- suelo -->
  <rect x="0" y="620" width="1200" height="280" fill="#2F4A3C"/>
  <rect x="0" y="620" width="1200" height="14" fill="#243A2F"/>

  <!-- estanteria baja tipo montessori -->
  <g>
    <rect x="90" y="380" width="480" height="16" fill="#2F4A3C"/>
    <rect x="90" y="560" width="480" height="16" fill="#2F4A3C"/>
    <line x1="90" y1="380" x2="90" y2="576" stroke="#2F4A3C" stroke-width="14"/>
    <line x1="570" y1="380" x2="570" y2="576" stroke="#2F4A3C" stroke-width="14"/>
    <line x1="330" y1="396" x2="330" y2="560" stroke="#2F4A3C" stroke-width="8"/>
  </g>
  <!-- cestas de tela en la estanteria -->
  <g>
    <rect x="120" y="420" width="170" height="120" rx="16" fill="#F1E9D8" stroke="#C4923D" stroke-width="6"/>
    <rect x="360" y="420" width="170" height="120" rx="16" fill="#F1E9D8" stroke="#C4923D" stroke-width="6"/>
  </g>

  <!-- bloques de construccion sobre la balda -->
  <g>
    <rect x="640" y="480" width="60" height="60" rx="8" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="4"/>
    <rect x="710" y="500" width="50" height="40" rx="8" fill="#F8F3E9" stroke="#C4923D" stroke-width="4"/>
    <circle cx="810" cy="520" r="30" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="4"/>
    <rect x="860" y="490" width="40" height="50" rx="10" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="4"/>
  </g>

  <!-- organizador colgante en red para peluches -->
  <g>
    <rect x="950" y="140" width="200" height="380" rx="16" fill="none" stroke="#C4923D" stroke-width="6"/>
    <line x1="950" y1="220" x2="1150" y2="220" stroke="#C4923D" stroke-width="3"/>
    <line x1="950" y1="300" x2="1150" y2="300" stroke="#C4923D" stroke-width="3"/>
    <line x1="950" y1="380" x2="1150" y2="380" stroke="#C4923D" stroke-width="3"/>
    <line x1="1050" y1="140" x2="1050" y2="520" stroke="#C4923D" stroke-width="3"/>
    <circle cx="1000" cy="180" r="24" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="4"/>
    <circle cx="1100" cy="260" r="24" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="4"/>
    <circle cx="1000" cy="340" r="24" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="4"/>
  </g>

  <!-- caja de donar -->
  <rect x="640" y="700" width="220" height="110" rx="14" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="6"/>
  <path d="M640 700 l110 -30 l110 30" fill="none" stroke="#2F4A3C" stroke-width="6"/>

  <!-- cesta baja al alcance de manos -->
  <rect x="120" y="720" width="220" height="90" rx="18" fill="#F1E9D8" stroke="#C4923D" stroke-width="6"/>

  <text x="600" y="875" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#F1E9D8" opacity="0.55">
    Casa en Orden — sustituye por tu fotografía real
  </text>
</svg>
