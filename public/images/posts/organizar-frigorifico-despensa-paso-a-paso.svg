<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#F1E9D8"/>

  <!-- pared -->
  <rect x="0" y="0" width="1200" height="620" fill="#F8F3E9"/>
  <!-- suelo -->
  <rect x="0" y="620" width="1200" height="280" fill="#2F4A3C"/>
  <rect x="0" y="620" width="1200" height="14" fill="#243A2F"/>

  <!-- puerta de frigorifico -->
  <rect x="90" y="90" width="420" height="620" rx="18" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="8"/>
  <rect x="90" y="90" width="420" height="220" rx="18" fill="none" stroke="#2F4A3C" stroke-width="4"/>
  <rect x="118" y="150" width="14" height="70" rx="7" fill="#C4923D"/>
  <rect x="118" y="380" width="14" height="70" rx="7" fill="#C4923D"/>

  <!-- baldas dentro (silueta) -->
  <line x1="90" y1="380" x2="510" y2="380" stroke="#2F4A3C" stroke-width="3" opacity="0.5"/>
  <line x1="90" y1="480" x2="510" y2="480" stroke="#2F4A3C" stroke-width="3" opacity="0.5"/>
  <g opacity="0.9">
    <rect x="150" y="330" width="60" height="40" rx="6" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
    <rect x="230" y="330" width="60" height="40" rx="6" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
    <rect x="310" y="330" width="60" height="40" rx="6" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
    <rect x="150" y="500" width="100" height="60" rx="8" fill="#F8F3E9" stroke="#C4923D" stroke-width="4"/>
    <rect x="270" y="500" width="100" height="60" rx="8" fill="#F8F3E9" stroke="#C4923D" stroke-width="4"/>
  </g>

  <!-- despensa: botes en balda -->
  <rect x="620" y="260" width="500" height="18" fill="#2F4A3C"/>
  <g>
    <rect x="650" y="150" width="80" height="110" rx="10" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="4"/>
    <rect x="668" y="132" width="44" height="20" rx="6" fill="#C4923D"/>
    <rect x="760" y="165" width="70" height="95" rx="10" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="4"/>
    <rect x="776" y="150" width="38" height="18" rx="6" fill="#C4923D"/>
    <rect x="860" y="150" width="80" height="110" rx="10" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="4"/>
    <rect x="878" y="132" width="44" height="20" rx="6" fill="#C4923D"/>
    <rect x="970" y="165" width="70" height="95" rx="10" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="4"/>
    <rect x="986" y="150" width="38" height="18" rx="6" fill="#C4923D"/>
  </g>

  <!-- organizador de latas en cascada -->
  <g>
    <rect x="650" y="420" width="380" height="30" rx="6" fill="#F1E9D8" stroke="#C4923D" stroke-width="4"/>
    <rect x="670" y="450" width="340" height="30" rx="6" fill="#F1E9D8" stroke="#C4923D" stroke-width="4"/>
    <rect x="690" y="480" width="300" height="30" rx="6" fill="#F1E9D8" stroke="#C4923D" stroke-width="4"/>
    <circle cx="700" cy="435" r="10" fill="#2F4A3C"/>
    <circle cx="740" cy="435" r="10" fill="#2F4A3C"/>
    <circle cx="720" cy="465" r="10" fill="#2F4A3C"/>
    <circle cx="760" cy="465" r="10" fill="#2F4A3C"/>
  </g>

  <!-- cesta consumir primero -->
  <rect x="850" y="700" width="220" height="110" rx="14" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="6"/>
  <line x1="880" y1="700" x2="880" y2="810" stroke="#2F4A3C" stroke-width="3"/>
  <line x1="920" y1="700" x2="920" y2="810" stroke="#2F4A3C" stroke-width="3"/>
  <line x1="960" y1="700" x2="960" y2="810" stroke="#2F4A3C" stroke-width="3"/>
  <line x1="1000" y1="700" x2="1000" y2="810" stroke="#2F4A3C" stroke-width="3"/>
  <line x1="1040" y1="700" x2="1040" y2="810" stroke="#2F4A3C" stroke-width="3"/>

  <text x="600" y="875" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#F1E9D8" opacity="0.55">
    Casa en Orden — sustituye por tu fotografía real
  </text>
</svg>
