<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#F1E9D8"/>

  <!-- pared -->
  <rect x="0" y="0" width="1200" height="620" fill="#F8F3E9"/>
  <!-- suelo -->
  <rect x="0" y="620" width="1200" height="280" fill="#2F4A3C"/>
  <rect x="0" y="620" width="1200" height="14" fill="#243A2F"/>

  <!-- estante flotante -->
  <rect x="100" y="220" width="1000" height="18" fill="#2F4A3C"/>

  <!-- toallas enrolladas -->
  <g>
    <rect x="140" y="140" width="60" height="80" rx="30" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="4"/>
    <rect x="215" y="150" width="60" height="70" rx="30" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="4"/>
    <rect x="290" y="140" width="60" height="80" rx="30" fill="#F1E9D8" stroke="#C4923D" stroke-width="4"/>
  </g>

  <!-- botes de dispensador uniformes -->
  <g>
    <rect x="420" y="120" width="46" height="100" rx="10" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="4"/>
    <rect x="434" y="104" width="18" height="20" rx="4" fill="#C4923D"/>
    <rect x="486" y="120" width="46" height="100" rx="10" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="4"/>
    <rect x="500" y="104" width="18" height="20" rx="4" fill="#C4923D"/>
    <rect x="552" y="120" width="46" height="100" rx="10" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="4"/>
    <rect x="566" y="104" width="18" height="20" rx="4" fill="#C4923D"/>
  </g>

  <!-- organizador giratorio de cremas -->
  <circle cx="820" cy="170" r="70" fill="#F1E9D8" stroke="#C4923D" stroke-width="6"/>
  <circle cx="820" cy="170" r="24" fill="#C4923D"/>
  <circle cx="820" cy="122" r="13" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
  <circle cx="861" cy="146" r="13" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
  <circle cx="861" cy="194" r="13" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
  <circle cx="779" cy="194" r="13" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
  <circle cx="779" cy="146" r="13" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>

  <!-- cestas apilables bajo lavabo -->
  <g>
    <rect x="150" y="700" width="180" height="70" rx="10" fill="#F1E9D8" stroke="#2F4A3C" stroke-width="5"/>
    <rect x="150" y="770" width="180" height="70" rx="10" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="5"/>
    <line x1="150" y1="720" x2="330" y2="720" stroke="#2F4A3C" stroke-width="3"/>
    <line x1="150" y1="750" x2="330" y2="750" stroke="#2F4A3C" stroke-width="3"/>
  </g>

  <!-- organizador de puerta para secador -->
  <rect x="420" y="670" width="140" height="170" rx="10" fill="#F1E9D8" stroke="#C4923D" stroke-width="6"/>
  <rect x="440" y="700" width="100" height="40" rx="8" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
  <rect x="440" y="755" width="100" height="40" rx="8" fill="#F8F3E9" stroke="#2F4A3C" stroke-width="3"/>
  <rect x="440" y="810" width="100" height="20" rx="6" fill="#C4923D"/>

  <!-- cestas de rejilla botiquin -->
  <g>
    <rect x="800" y="720" width="120" height="100" rx="10" fill="none" stroke="#2F4A3C" stroke-width="5"/>
    <line x1="820" y1="720" x2="820" y2="820" stroke="#2F4A3C" stroke-width="3"/>
    <line x1="850" y1="720" x2="850" y2="820" stroke="#2F4A3C" stroke-width="3"/>
    <line x1="880" y1="720" x2="880" y2="820" stroke="#2F4A3C" stroke-width="3"/>
    <line x1="900" y1="720" x2="900" y2="820" stroke="#2F4A3C" stroke-width="3"/>

    <rect x="950" y="720" width="120" height="100" rx="10" fill="none" stroke="#C4923D" stroke-width="5"/>
    <line x1="970" y1="720" x2="970" y2="820" stroke="#C4923D" stroke-width="3"/>
    <line x1="1000" y1="720" x2="1000" y2="820" stroke="#C4923D" stroke-width="3"/>
    <line x1="1030" y1="720" x2="1030" y2="820" stroke="#C4923D" stroke-width="3"/>
    <line x1="1050" y1="720" x2="1050" y2="820" stroke="#C4923D" stroke-width="3"/>
  </g>

  <text x="600" y="875" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#F1E9D8" opacity="0.55">
    Casa en Orden — sustituye por tu fotografía real
  </text>
</svg>
